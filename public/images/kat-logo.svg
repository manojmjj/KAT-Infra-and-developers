<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" class="kat-full-logo" aria-label="KAT Infra and Developers Logo">
  <defs>
    <linearGradient id="katNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F284E" />
      <stop offset="100%" stop-color="#0058B3" />
    </linearGradient>
    <linearGradient id="katGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="katSteelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Geometric Architectural Emblem (KAT Tower Mark) -->
  <g transform="translate(6, 4)">
    <!-- Base Foundation Slab -->
    <rect x="2" y="50" width="52" height="4" rx="2" fill="url(#katNavyGrad)" />
    <rect x="10" y="45" width="36" height="3" rx="1.5" fill="url(#katGoldGrad)" />

    <!-- Left Pillar (K Structural Leg) -->
    <path d="M4 42V12c0-2.2 1.8-4 4-4h2c2.2 0 4 1.8 4 4v30H4z" fill="url(#katNavyGrad)" />
    <!-- Diagonal Strut (K Angle / Girder) -->
    <path d="M14 26l11-16c1.2-1.8 3.6-2.2 5.3-0.9 1.5 1.1 1.9 3.2 0.9 4.8L22 28l10.5 13.5c1.2 1.6 0.8 3.8-0.8 5-1.5 1.1-3.6 0.8-4.7-0.7L14 30v-4z" fill="url(#katNavyGrad)" />

    <!-- Center Apex Tower (A / Tower Chevron representing KAT Towers Gummidipondi) -->
    <path d="M28 42L36 6c0.8-2.2 3.8-2.2 4.6 0l8 36h-7l-3.3-15.5-3.3 15.5H28z" fill="url(#katSteelGrad)" />
    <!-- Tower Gold Beam Link -->
    <polygon points="33.5,31 43,31 41.8,27 34.5,27" fill="url(#katGoldGrad)" />

    <!-- Right Cantilever Beam (T Truss) -->
    <path d="M37 10h18c1.7 0 3 1.3 3 3s-1.3 3-3 3h-6v26h-6V16h-6v-6z" fill="url(#katNavyGrad)" opacity="0.95" />

    <!-- Dynamic Architectural Ascending Spark / Accent Diamond -->
    <path d="M48 4l2.5 4.5L55 11l-4.5 2.5L48 18l-2.5-4.5L41 11l4.5-2.5L48 4z" fill="url(#katGoldGrad)" />
  </g>

  <!-- Typography Lockup -->
  <!-- Primary Brand: KAT -->
  <text x="76" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="1.5" fill="#0F172A">KAT</text>

  <!-- Secondary Wordmark: INFRA AND DEVELOPERS -->
  <text x="77" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2.8" fill="#D97706">INFRA AND DEVELOPERS</text>

  <!-- Divider & Location Badge -->
  <line x1="218" y1="16" x2="218" y2="48" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- HQ / Location Info -->
  <g transform="translate(228, 18)">
    <rect x="0" y="0" width="82" height="15" rx="3" fill="#EEF2F6" />
    <text x="5" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0058B3" letter-spacing="0.5">HQ · KAT TOWERS</text>

    <text x="2" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.4">GUMMIDIPONDI</text>
  </g>
</svg>